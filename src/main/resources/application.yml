spring:
  application:
    name: ligadospalpites-core

  datasource:
    url: jdbc:postgresql://localhost:5432/ligadospalpites
    username: palpiteiro
    password: supersecretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 25

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.springframework: INFO
    com.ligadospalpites: DEBUG
    org.zalando.logbook: TRACE

logbook:
  exclude:
    - /actuator/**
    - /swagger-ui/**
    - /v3/api-docs/**
  filter:
    enabled: true
  secure: true
  obfuscate:
    headers:
      - "Authorization"
      - "Cookie"
    parameters:
      - "password"
      - "client_secret"

app:
  admin:
    api-key: "${ADMIN_API_KEY:${WORKSPACE_ADMIN_API_KEY:lp_ws_live_secret_key_2026_x89f}}"
  sportsfeed:
    football-data:
      url: "https://api.football-data.org"
      api-key: "${FOOTBALL_DATA_API_KEY:mock-key-fd}"
    api-football:
      url: "https://v3.football.api-sports.io"
      api-key: "${API_FOOTBALL_API_KEY:mock-key-af}"
    api-basketball:
      url: "https://v1.basketball.api-sports.io"
      api-key: "${API_BASKETBALL_API_KEY:${API_FOOTBALL_API_KEY:mock-key-af}}"
    news-api:
      url: "https://newsapi.org"
      api-key: "${NEWS_API_KEY:mock-key-news}"
    balldontlie:
      url: "${BALLDONTLIE_URL:https://api.balldontlie.io}"
      api-key: "${BALLDONTLIE_API_KEY:mock-key-bdl}"
    espn-soccer:
      url: "${ESPN_SOCCER_URL:https://site.api.espn.com}"
    espn:
      basketball:
        url: "${ESPN_BASKETBALL_URL:https://site.api.espn.com/apis/site/v2/sports/basketball}"
    pandascore:
      url: "${PANDASCORE_URL:https://api.pandascore.co}"
      token: "${PANDASCORE_API_KEY:${PANDASCORE_TOKEN:}}"

resilience4j:
  circuitbreaker:
    instances:
      footballDataApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
      apiFootballApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
      apiBasketballApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
      balldontlieApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
      newsApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
      espnSoccerApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
      pandaScoreApi:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 5s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    instances:
      footballDataApi:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoff:
          enabled: true
          multiplier: 2
      apiFootballApi:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoff:
          enabled: true
          multiplier: 2
      apiBasketballApi:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoff:
          enabled: true
          multiplier: 2
      newsApi:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoff:
          enabled: true
          multiplier: 2
      espnSoccerApi:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoff:
          enabled: true
          multiplier: 2
      pandaScoreApi:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoff:
          enabled: true
          multiplier: 2
