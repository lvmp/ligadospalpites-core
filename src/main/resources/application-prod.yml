spring:
  config:
    activate:
      on-profile: prod

  main:
    lazy-initialization: true
  jmx:
    enabled: false

  # Supabase PostgreSQL configuration (pooled endpoint: jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require)
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      client-type: lettuce
      lettuce:
        shutdown-timeout: 100ms

server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 35
      min-spare: 5
    accept-count: 50
